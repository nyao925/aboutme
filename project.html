<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情</title>
  <link href="./stylesheets/page-style.css" type="text/css" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./static/img/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./static/img/favicon/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./static/img/favicon/apple-touch-icon.png">
  <script src="./scripts/site.js"></script>
</head>

<body>

<header>
  <nav id="home-nav">
    <ul>
      <li>
        <a class="nav-home" id="nav-home" href="./index.html">
          <img class="brand-mark" src="./static/img/favicon/favicon-32.png" alt="" width="28" height="28">
          <strong id="brand-name">饺子大人</strong>
        </a>
      </li>
      <li class="has-submenu">
        <a href="#" id="nav-personal-projects" aria-haspopup="true" aria-expanded="false">
          <span id="nav-personal-projects-label"></span>
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </a>
        <ul id="personal-projects-submenu" class="submenu"></ul>
      </li>
      <li class="nav-spacer"></li>
      <li class="nav-controls">
        <select id="lang-select" aria-label="Language">
          <option value="zh" id="switch-zh">中文</option>
          <option value="ja" id="switch-ja">日本語</option>
          <option value="en" id="switch-en">English</option>
        </select>
        <button type="button" id="theme-toggle" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </li>
    </ul>
  </nav>
</header>

<main>
  <section class="card">
    <h1 id="hero-title"></h1>
    <div id="project-not-found" style="display:none;">
      <p id="project-not-found-text"></p>
      <p><a href="./index.html" id="project-back-home"></a></p>
    </div>
    <div id="project-detail" class="project-detail" style="display:none;"></div>
  </section>
</main>

<footer>
  <p><strong id="footer-email-label">Email:</strong> <span id="footer-email-value"></span></p>
  <p><strong id="footer-updated-label"></strong> <span id="footer-updated-value"></span></p>
  <p id="footer-copyright"></p>
</footer>

<script>
  async function loadLocale(lang) {
    try {
      const res = await fetch('./i18n/' + lang + '.json');
      if (!res.ok) {
        throw new Error('Failed to load locale: ' + lang);
      }
      const data = await res.json();
      applyLocale(data, lang);
      localStorage.setItem('aboutme-lang', lang);
    } catch (err) {
      console.error(err);
    }
  }

  function getProjectId() {
    return new URLSearchParams(window.location.search).get('id');
  }

  function applyLocale(data, lang) {
    document.documentElement.lang = lang === 'ja' ? 'ja' : (lang === 'en' ? 'en' : 'zh-CN');

    document.getElementById('brand-name').textContent = data.brandName;
    document.getElementById('nav-home').setAttribute('aria-label', data.brandName);
    document.getElementById('switch-zh').textContent = data.langSwitch.zh;
    document.getElementById('switch-ja').textContent = data.langSwitch.ja;
    document.getElementById('switch-en').textContent = data.langSwitch.en;
    document.getElementById('theme-toggle').setAttribute('aria-label', data.themeToggle);

    document.getElementById('nav-personal-projects-label').textContent = data.experience.personalProjects.title;
    renderPersonalProjectsMenu(data.experience.personalProjects.items);

    document.getElementById('footer-email-label').textContent = data.footer.emailLabel;
    document.getElementById('footer-email-value').textContent = data.contact.email;
    document.getElementById('footer-updated-label').textContent = data.footer.lastUpdatedLabel;
    document.getElementById('footer-updated-value').textContent = data.footer.lastUpdated;
    document.getElementById('footer-copyright').textContent = data.footer.copyright;

    const projectId = getProjectId();
    const project = data.experience.personalProjects.items.find(function (item) {
      return item.id === projectId;
    });

    if (project) {
      document.title = project.name + ' | ' + data.brandName;
      document.getElementById('hero-title').textContent = project.name;
      renderProjectDetail(project);
    } else {
      document.title = data.metaTitle;
      document.getElementById('hero-title').textContent = data.experience.personalProjects.title;
      document.getElementById('project-not-found').style.display = 'block';
      document.getElementById('project-detail').style.display = 'none';
      document.getElementById('project-not-found-text').textContent = lang === 'ja'
        ? 'プロジェクトが見つかりませんでした。'
        : (lang === 'en' ? 'Project not found.' : '未找到该项目。');
      document.getElementById('project-back-home').textContent = lang === 'ja'
        ? 'トップページに戻る'
        : (lang === 'en' ? 'Back to home' : '返回首页');
    }
  }

  function renderPersonalProjectsMenu(items) {
    const submenu = document.getElementById('personal-projects-submenu');
    submenu.innerHTML = '';
    items.forEach(function (project) {
      const li = document.createElement('li');
      const link = document.createElement('a');
      link.href = 'project.html?id=' + encodeURIComponent(project.id);
      link.textContent = project.name;
      li.appendChild(link);
      submenu.appendChild(li);
    });
  }

  const GITHUB_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 2.9.8.1-.6.4-1.1.7-1.3-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7c-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7a3.9 3.9 0 0 1 1 2.7c0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>';

  function renderProjectDetail(project) {
    const detail = document.getElementById('project-detail');
    document.getElementById('project-not-found').style.display = 'none';
    detail.style.display = 'block';
    detail.innerHTML = '';

    const header = document.createElement('div');
    header.className = 'project-detail-header';

    const tags = document.createElement('div');
    tags.className = 'project-card-tags';
    project.tags.forEach(function (tag) {
      const span = document.createElement('span');
      span.className = 'project-card-tag';
      span.textContent = tag;
      tags.appendChild(span);
    });
    header.appendChild(tags);

    if (project.link) {
      const link = document.createElement('a');
      link.className = 'project-card-link';
      link.href = project.link;
      link.target = '_blank';
      link.rel = 'noopener';
      link.innerHTML = GITHUB_ICON;
      link.appendChild(document.createTextNode('GitHub'));
      header.appendChild(link);
    }
    detail.appendChild(header);

    project.detail.intro.forEach(function (paragraph) {
      const p = document.createElement('p');
      p.className = 'project-detail-text';
      p.textContent = paragraph;
      detail.appendChild(p);
    });

    const topicsList = document.createElement('ul');
    topicsList.className = 'project-detail-topics';
    project.detail.topics.forEach(function (topic) {
      const li = document.createElement('li');
      li.textContent = topic;
      topicsList.appendChild(li);
    });
    detail.appendChild(topicsList);

    if (project.detail.usage) {
      const usageTitle = document.createElement('h4');
      usageTitle.className = 'project-detail-subtitle';
      usageTitle.textContent = project.detail.usage.title;
      detail.appendChild(usageTitle);

      const usageList = document.createElement('ol');
      usageList.className = 'project-detail-usage';
      project.detail.usage.steps.forEach(function (step) {
        const li = document.createElement('li');
        li.textContent = step;
        usageList.appendChild(li);
      });
      detail.appendChild(usageList);
    }
  }

  document.getElementById('lang-select').addEventListener('change', function () {
    loadLocale(this.value);
  });

  const initLang = localStorage.getItem('aboutme-lang') || 'zh';
  document.getElementById('lang-select').value = initLang;
  loadLocale(initLang);
</script>

</body>
</html>
