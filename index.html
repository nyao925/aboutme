<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="./scripts/site.js?v=20261013"></script>
</head>

<body>

<header>
  <nav id="home-nav">
    <ul>
      <li>
        <a class="nav-home" id="nav-home" href="./index.html">
          <img class="brand-mark" src="./static/img/favicon/favicon-32.png" alt="" width="28" height="28">
          <strong id="brand-name">饺子大人</strong>
        </a>
      </li>
      <li class="has-submenu">
        <a href="#" id="nav-personal-projects" aria-haspopup="true" aria-expanded="false">
          <span id="nav-personal-projects-label"></span>
          <svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </a>
        <ul id="personal-projects-submenu" class="submenu"></ul>
      </li>
      <li class="nav-spacer"></li>
      <li class="nav-controls">

          <option value="ja" id="switch-ja">日本語</option>
          <option value="en" id="switch-en">English</option>

        <button type="button" id="theme-toggle" aria-label="Toggle dark mode">

          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </li>
    </ul>
  </nav>
</header>

<section class="hero-banner">
  <div class="hero-inner">
    <div class="avatar-wrap">
      <img class="avatar" src="./static/img/description/my_pic.PNG" alt="" width="152" height="152">
    </div>
    <div class="hero-copy">
      <h1 id="hero-title">关于饺子大人</h1>
      <p id="intro-0" class="lead"></p>
      <div class="hero-links">
        <a class="hero-link" id="hero-email" href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <span id="hero-email-label"></span>
        </a>
        <a class="hero-link" id="hero-github" href="#" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 2.9.8.1-.6.4-1.1.7-1.3-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7c-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7a3.9 3.9 0 0 1 1 2.7c0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>
          <span id="hero-github-label"></span>
        </a>
      </div>
    </div>
  </div>
  <svg class="hero-wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 48C240 80 480 80 720 56S1200 8 1440 32V80H0z"/></svg>
</section>

<main>
  <section class="card about-card">
    <p id="intro-1"></p>
    <p id="intro-2"></p>
    <p id="intro-3"></p>
  </section>

  <section class="card">
    <h2 id="skills-title" class="section-title"></h2>
    <div id="skills-groups"></div>
    <p id="closing" class="closing"></p>
  </section>

  <section class="card">
    <h2 id="career-title" class="section-title"></h2>
    <ul id="career-items" class="timeline"></ul>
  </section>

  <section class="card">
    <h2 id="projects-title" class="section-title"></h2>
    <ul id="projects-items" class="check-list"></ul>
  </section>

  <section class="card">
    <h2 id="personal-projects-title" class="section-title"></h2>
    <div id="personal-projects-cards" class="project-grid"></div>
  </section>

  <section class="card">
    <h2 id="education-title" class="section-title"></h2>
    <ul id="education-items" class="timeline"></ul>
  </section>

  <section class="card">
    <h2 id="certifications-title" class="section-title"></h2>
    <ul id="certifications-items" class="chips chips-outline"></ul>
  </section>

  <section class="card">
    <h2 id="contact-title" class="section-title"></h2>
    <p id="contact-desc" class="contact-desc"></p>
    <div class="contact-grid">
      <a class="contact-item" id="contact-email-link" href="#">
        <span class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        </span>
        <span class="contact-meta">
          <span id="email-label" class="contact-label"></span>
          <span id="contact-email" class="contact-value"></span>
        </span>
      </a>
      <a class="contact-item" id="contact-github-link" href="#" target="_blank" rel="noopener">
        <span class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 2.9.8.1-.6.4-1.1.7-1.3-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7c-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7a3.9 3.9 0 0 1 1 2.7c0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>
        </span>
        <span class="contact-meta">
          <span id="github-label" class="contact-label"></span>
          <span id="contact-github" class="contact-value"></span>
        </span>
      </a>
      <div class="contact-item">
        <span class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        </span>
        <span class="contact-meta">
          <span id="qq-label" class="contact-label"></span>
          <span id="contact-qq" class="contact-value"></span>
        </span>
      </div>
    </div>
  </section>
</main>

<footer>
  <p><strong id="footer-email-label">Email:</strong> <span id="footer-email-value"></span></p>
  <p><strong id="footer-updated-label"></strong> <span id="footer-updated-value"></span></p>
  <p id="footer-copyright"></p>
</footer>

<script>
  async function loadLocale(lang) {
    try {
      const res = await fetch('./i18n/' + lang + '.json');
      if (!res.ok) {
        throw new Error('Failed to load locale: ' + lang);
      }
      const data = await res.json();
      applyLocale(data, lang);
      localStorage.setItem('aboutme-lang', lang);
    } catch (err) {
      console.error(err);
    }
  }

  function applyLocale(data, lang) {
    document.documentElement.lang = lang === 'ja' ? 'ja' : (lang === 'en' ? 'en' : 'zh-CN');
    document.title = data.metaTitle;

    document.getElementById('brand-name').textContent = data.brandName;
    document.getElementById('nav-home').setAttribute('aria-label', data.brandName);
    document.getElementById('switch-zh').textContent = data.langSwitch.zh;
    document.getElementById('switch-ja').textContent = data.langSwitch.ja;
    document.getElementById('switch-en').textContent = data.langSwitch.en;
    document.getElementById('theme-toggle').setAttribute('aria-label', data.themeToggle);
    document.getElementById('hero-title').textContent = data.heroTitle;

    data.intro.forEach(function (line, index) {
      const el = document.getElementById('intro-' + index);
      if (el) {
        el.textContent = line;
      }
    });

    document.getElementById('skills-title').textContent = data.skills.title;
    renderSkillGroups(data.skills.groups);

    document.getElementById('closing').textContent = data.closing;

    renderTimelineSection('career', data.experience.career);
    renderListSection('projects', data.experience.projects);

    const personalProjects = data.experience.personalProjects;
    document.getElementById('nav-personal-projects-label').textContent = personalProjects.title;
    document.getElementById('personal-projects-title').textContent = personalProjects.title;
    renderPersonalProjectsMenu(personalProjects.items);
    renderPersonalProjectCards(personalProjects);

    renderTimelineSection('education', data.experience.education);
    renderListSection('certifications', data.experience.certifications, 'chip');

    document.getElementById('contact-title').textContent = data.contact.title;
    document.getElementById('contact-desc').textContent = data.contact.desc;
    document.getElementById('email-label').textContent = stripColon(data.contact.labels.email);
    document.getElementById('github-label').textContent = stripColon(data.contact.labels.github);
    document.getElementById('qq-label').textContent = stripColon(data.contact.labels.qq);
    document.getElementById('contact-email').textContent = data.contact.email;
    document.getElementById('contact-email-link').href = 'mailto:' + data.contact.email;
    document.getElementById('contact-github').textContent = data.contact.github.replace(/^https?:\/\//, '');
    document.getElementById('contact-github-link').href = data.contact.github;
    document.getElementById('hero-email').href = 'mailto:' + data.contact.email;
    document.getElementById('hero-email-label').textContent = stripColon(data.contact.labels.email);
    document.getElementById('hero-github').href = data.contact.github;
    document.getElementById('hero-github-label').textContent = 'GitHub';
    document.getElementById('contact-qq').textContent = data.contact.qq;

    document.getElementById('footer-email-label').textContent = data.footer.emailLabel;
    document.getElementById('footer-email-value').textContent = data.contact.email;
    document.getElementById('footer-updated-label').textContent = data.footer.lastUpdatedLabel;
    document.getElementById('footer-updated-value').textContent = data.footer.lastUpdated;
    document.getElementById('footer-copyright').textContent = data.footer.copyright.replace('{year}', new Date().getFullYear());
  }

  // Labels in the locale files end with a colon, which the card layout doesn't need.
  function stripColon(label) {
    return label.replace(/[:：]\s*$/, '');
  }

  function renderListSection(prefix, section, itemClass) {
    document.getElementById(prefix + '-title').textContent = section.title;
    const list = document.getElementById(prefix + '-items');
    list.innerHTML = '';
    section.items.forEach(function (item) {
      const li = document.createElement('li');
      if (itemClass) {
        li.className = itemClass;
      }
      li.textContent = item;
      list.appendChild(li);
    });
  }

  // Splits "2023年9月 - 至今 DXC" / "Sep 2023 - Present, DXC" into a date range and the rest.
  const DATE_RANGE = /^(\S+(?: \d{4})? - (?:至今|現在|Present|\S+(?: \d{4})?))[,，]?\s+(.+)$/;

  function renderTimelineSection(prefix, section) {
    document.getElementById(prefix + '-title').textContent = section.title;
    const list = document.getElementById(prefix + '-items');
    list.innerHTML = '';
    section.items.forEach(function (item) {
      const li = document.createElement('li');
      const match = item.match(DATE_RANGE);
      if (match) {
        const date = document.createElement('span');
        date.className = 'timeline-date';
        date.textContent = match[1];
        li.appendChild(date);
      }
      const text = document.createElement('span');
      text.className = 'timeline-text';
      text.textContent = match ? match[2] : item;
      li.appendChild(text);
      list.appendChild(li);
    });
  }

  function renderSkillGroups(groups) {
    const wrapper = document.getElementById('skills-groups');
    wrapper.innerHTML = '';
    groups.forEach(function (group) {
      const row = document.createElement('div');
      row.className = 'skill-group';
      const name = document.createElement('div');
      name.className = 'skill-group-name';
      name.textContent = group.name;
      row.appendChild(name);
      const chips = document.createElement('ul');
      chips.className = 'chips';
      group.items.forEach(function (skill) {
        const chip = document.createElement('li');
        chip.className = 'chip';
        chip.textContent = skill;
        chips.appendChild(chip);
      });
      row.appendChild(chips);
      wrapper.appendChild(row);
    });
  }

  function renderPersonalProjectCards(section) {
    const grid = document.getElementById('personal-projects-cards');
    grid.innerHTML = '';
    section.items.forEach(function (project) {
      const card = document.createElement('a');
      card.className = 'project-card';
      card.href = 'project.html?id=' + encodeURIComponent(project.id);

      const type = document.createElement('span');
      type.className = 'project-card-type';
      type.textContent = project.type;
      card.appendChild(type);

      const name = document.createElement('h3');
      name.className = 'project-card-name';
      name.textContent = project.name;
      card.appendChild(name);

      const summary = document.createElement('p');
      summary.className = 'project-card-summary';
      summary.textContent = project.summary;
      card.appendChild(summary);

      const tags = document.createElement('div');
      tags.className = 'project-card-tags';
      project.tags.forEach(function (tag) {
        const span = document.createElement('span');
        span.className = 'project-card-tag';
        span.textContent = tag;
        tags.appendChild(span);
      });
      card.appendChild(tags);

      const more = document.createElement('span');
      more.className = 'project-card-more';
      more.textContent = section.viewDetails + ' →';
      card.appendChild(more);

      grid.appendChild(card);
    });
  }

  function renderPersonalProjectsMenu(items) {
    const submenu = document.getElementById('personal-projects-submenu');
    submenu.innerHTML = '';
    items.forEach(function (project) {
      const li = document.createElement('li');
      const link = document.createElement('a');
      link.href = 'project.html?id=' + encodeURIComponent(project.id);
      link.textContent = project.name;
      li.appendChild(link);
      submenu.appendChild(li);
    });
  }

  document.getElementById('lang-select').addEventListener('change', function () {
    loadLocale(this.value);
  });

  const initLang = localStorage.getItem('aboutme-lang') || 'zh';
  document.getElementById('lang-select').value = initLang;
  loadLocale(initLang);
</script>

</body>
</html>
